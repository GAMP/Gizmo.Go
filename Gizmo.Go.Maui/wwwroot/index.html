<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gizmo Go</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/Gizmo.Go.UI/css/app.css" />
</head>

<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui" style="display:none">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">&#10006;</span>
    </div>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        // MAUI Blazor Hybrid: the native bridge (window.external.receiveMessage) may not
        // be ready when blazor.webview.js loads. With autostart="false", we poll for the
        // bridge and start Blazor manually once it's available, ensuring the full
        // initialization sequence (including WebViewNavigationManager) completes correctly.
        (function startWhenReady() {
            if (window.external && typeof window.external.receiveMessage === 'function') {
                Blazor.start();
            } else {
                setTimeout(startWhenReady, 100);
            }
        })();
    </script>
</body>

</html>
